<!-- 
  Link grid component
  Supports 2, 3, or 4 columns based on the number of direct child div elements.
  5 or more items are rendered in a 4-column layout.
  Optional override: set data-columns="2", data-columns="3", or data-columns="4"
  on .template-link-grid to force that layout even with many child items.
-->
<div class="template-link-grid">
  <div>
    <a href="javascript:;">Short link 1</a>
  </div>
  <div>
    <a href="javascript:;">Short link 2</a>
  </div>
  <div>
    <a href="javascript:;">Short link 3</a>
  </div>
</div>
