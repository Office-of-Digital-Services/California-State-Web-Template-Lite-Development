  Use data-mode="dark" on nav.template-breadcrumbs for white text/link styling.
-->

<catempl-breadcrumbs>
  <nav aria-label="Breadcrumbs">
    <ol>
      <li><a href="javascript:;" title="Home page">Breadcrumb 1</a></li>
      <li>
        <a href="javascript:;" title="Examples landing page">Breadcrumb 2</a>
      </li>
      <li class="active">Breadcrumb 3</li>
    </ol>
  </nav>
</catempl-breadcrumbs>
