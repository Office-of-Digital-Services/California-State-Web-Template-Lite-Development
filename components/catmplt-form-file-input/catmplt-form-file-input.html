<catmplt-form-file-input>
  <!-- 
  Form file input component
  
  Features:
  - Bootstrap-like file input styling
  - "Choose File" button that extends to full input height
  - Proper spacing between button and feedback text
  - Consistent styling across all browsers (Chrome, Safari, Firefox, Edge)
  - Accessible focus and hover states
  - Support for dark border variant via data-border-dark attribute
  - Required field indicator support
-->
  <label for="inputFile" data-required="true">Upload your file</label>
  <div>
    <input type="file" id="inputFile" required data-border-dark="true" />
  </div>
</catmplt-form-file-input>
