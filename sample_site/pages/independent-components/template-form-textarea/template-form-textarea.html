<!-- 
  Form textarea component
  
  Attributes:
  - data-required="true": Adds a red asterisk (*) before the label to indicate a required field
  - data-border-dark="true": Changes the border color to a darker gray (--gray-700) instead of default
  - required: HTML5 required attribute to enforce validation
-->
<label class="template-form-textarea-label" data-required="true" for="exampleInputComment">Your message</label>
<textarea class="template-form-textarea-input" id="exampleInputComment" data-border-dark="true" required></textarea>
